{% extends "base.html" %}
{% block titulo %}Horario no permitido{% endblock %}
{% block contenido %}
<div class="row justify-content-center py-5">
  <div class="col-md-8 col-lg-6">
    <div class="card border-warning">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold text-warning-emphasis">Horario no permitido</h1>
        <p>{{ mensaje }}</p>
        <p class="small text-muted">Horario de atención: lunes a viernes de 08:00 a 18:00; sábados de 08:00 a 13:00. Domingos cerrado.</p>
        <a class="btn btn-outline-secondary" href="{% url 'consultas:agendar_cita' %}">Elegir otro horario</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
